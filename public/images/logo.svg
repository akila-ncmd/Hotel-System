<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
  <!--
    Diamond Shine emblem.

    Deliberately contains no text: the brand name is rendered next to it from
    config('app.name'), so renaming the chain never leaves a stale wordmark
    baked into an image. Uses currentColor so it inherits the navbar text
    colour and its hover state.
  -->
  <circle cx="32" cy="32" r="29" stroke-width="1.4"/>

  <!-- Brilliant cut: table, crown, girdle, pavilion. -->
  <path d="M24 22 H40"/>
  <path d="M24 22 L15 30 H49 L40 22"/>
  <path d="M15 30 L32 50 L49 30"/>

  <!-- Crown facets meeting at the culet. -->
  <path d="M24 22 L32 50" stroke-width="1.1" opacity="0.55"/>
  <path d="M40 22 L32 50" stroke-width="1.1" opacity="0.55"/>
</svg>
